name: Pull L2L data
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: l2l-feed
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch L2L (read only)
        env:
          L2L_KEY: ${{ secrets.L2L_KEY }}
        run: python3 l2l_feed.py
      - name: Save l2l.json if it changed
        run: |
          git config user.name "l2l-feed"
          git config user.email "l2l-feed@users.noreply.github.com"
          git add l2l.json
          git diff --cached --quiet || (git commit -m "L2L data" && git pull --rebase -q && git push)
